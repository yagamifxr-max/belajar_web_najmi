<!DOCTYPE html>
<html>
<head>
    <title>Form Pendaftaran</title>
</head>
<body>

<h2>Form Pendaftaran Ekskul RPL</h2>

<form>
    Nama Lengkap:<br>
    <input type="text" placeholder="Masukkan Nama Lengkap" required>
    <br><br>

    Tanggal Lahir:<br>
    <input type="date" required>
    <br><br>

    Nomor HP/WA:<br>
    <input type="number" placeholder="Masukkan Nomor HP/WA" required>
    <br><br>

    <button type="submit">Daftar</button>
</form>

</body>
</html>
