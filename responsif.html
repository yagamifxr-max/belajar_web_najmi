<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Media Query</title>
    <style>
        h1 {
            color: black;
            text-align: center;
        }

        /* Jika Layar 600px atau lebih kecil */
        @media screen and (max-width: 600px) {
            h1 {
                color: rgb(227, 98, 98);
                font-size: 18px;
            }
        } 
    </style>
</head>

<body>
    <h1>Coba Kecilkan jendela browsermu!</h1>
</body>
</html>
