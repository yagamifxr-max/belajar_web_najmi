<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Sekolah</title>

    <style>
        body {
            margin: 0;
            font-family: arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #1a237e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .menu-link {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .menu-link a {
            color: white;
            text-decoration: none;
        }

        .menu-link a:hover {
            color: #ffca28;
        }

        /* ATURAN KHUSUS LAYAR HP (Batas Lebar 600px) */
        @media screen and (max-width: 600px) {

            .navbar {
                flex-direction: column;
                text-align: center;
            }

            .menu-link {
                flex-direction: column;
                margin-top: 15px;
                width: 100%;
            }

            .menu-link li {
                padding: 10px 0;
                border-bottom: 1px solid rgba(255,255,255,0.2);
            }
        }

    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">SMK MUHAMMADIYAH 3 TANGERANG SELATAN</div>

        <ul class="menu-link">
            <li><a href="a">Beranda</a></li>
            <li><a href="a">Profil Jurusan</a></li>
            <li><a href="a">Kontak</a></li>
        </ul>
    </nav>

</body>
</html>
