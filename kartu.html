<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .Kartu {
            background-color: #ffffff;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 1px solid #ddd;
        }

        .Foto {
            border-radius: 50%;
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        .Pekerjaan {
            color: gray;
            margin-top: -10px;
        }

        .btn-kontak {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="Kartu">
        <img src="Zoro.jpg" alt="Foto Profil" class="Foto">
        <h2>Najmi Aliu</h2>
        <p class="Pekerjaan">Siswa RPL</p>
        <button class="btn-kontak">Kontak Saya</button>
    </div>
</body>
</html>
